services:
  neo4j:
    image: neo4j:5.26-community
    container_name: casegraph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/casegraph-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 3G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_db_memory_transaction_total_max: 2G
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - ./backend/data/import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
  neo4j-logs:
